<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17324f"/>
      <stop offset="1" stop-color="#2f7fc1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>

  <!-- Stacked layers: groups of clusters -->
  <g fill="none" stroke="#fff" stroke-width="14" stroke-linejoin="round" stroke-linecap="round">
    <path d="M250 110 L340 155 L250 200 L160 155 Z" fill="#fff"/>
    <path d="M160 200 L250 245 L340 200"/>
    <path d="M160 245 L250 290 L340 245"/>
  </g>

  <!-- A navigator-like list of groups, each with its connection state -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#fff">
    <rect x="420" y="112" width="240" height="40" rx="8" fill="#fff" fill-opacity="0.16"/>
    <text x="440" y="139" font-size="20" font-weight="700">Cluster Groups</text>

    <rect x="450" y="166" width="210" height="32" rx="7" fill="#fff" fill-opacity="0.1"/>
    <text x="466" y="188" font-size="17">Production</text>
    <circle cx="640" cy="182" r="7" fill="#3ddc84"/>

    <rect x="450" y="208" width="210" height="32" rx="7" fill="#fff" fill-opacity="0.1"/>
    <text x="466" y="230" font-size="17">Staging</text>
    <circle cx="640" cy="224" r="7" fill="#3ddc84"/>

    <rect x="450" y="250" width="210" height="32" rx="7" fill="#fff" fill-opacity="0.1"/>
    <text x="466" y="272" font-size="17">Development</text>
    <circle cx="640" cy="266" r="7" fill="none" stroke="#fff" stroke-width="2.5" stroke-opacity="0.7"/>
  </g>
</svg>
